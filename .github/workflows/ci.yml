name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies (Backend)
      run: |
        cd backend
        npm ci

    - name: Install Dependencies (Frontend)
      run: |
        cd frontend
        npm ci

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    # During a real hackathon or production setting, you would add lines here to automatically configure AWS or run Cypress Tests.
    - name: DevOps Health Check
      run: echo "Codebase perfectly built and packaged. Ready for containerization!"
