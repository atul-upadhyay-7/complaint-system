version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campusdesk-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Ports commented out because Nginx proxies it entirely, 
    # but uncomment 5000:5000 if you need direct backend access
    # ports:
    #  - "5000:5000"
    environment:
      - NODE_ENV=production
      # - MONGO_URI=mongodb+srv://... (If using external Atlas DB)
      # - JWT_SECRET=your_super_secret_jwt_key
    networks:
      - campusdesk-network
    restart: unless-stopped

networks:
  campusdesk-network:
    driver: bridge
